<!-- ============================================================
     CareKaki — App Shell Layout
     Responsive: Sidebar on desktop, bottom-nav on mobile
     ============================================================ -->

<!-- Mobile overlay backdrop -->
@if (sidebarOpen()) {
  <div class="sidebar-backdrop" (click)="closeSidebar()"></div>
}

<!-- ===== Sidebar (Desktop + Mobile drawer) ===== -->
<aside class="sidebar" [class.open]="sidebarOpen()">
  <!-- Brand -->
  <div class="sidebar-brand">
    <div class="brand-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
    </div>
    <div class="brand-text">
      <span class="brand-name">CareKaki</span>
      <span class="brand-tagline">Agentic Care Operations</span>
    </div>
    <button class="sidebar-close" (click)="closeSidebar()" aria-label="Close menu">
      <app-icon name="x" [size]="22"/>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    @for (link of navLinks; track link.route) {
      <a
        [routerLink]="link.route"
        routerLinkActive="active"
        (click)="closeSidebar()"
        class="nav-link"
      >
        <app-icon [name]="link.icon" [size]="20"/>
        <span>{{ link.label }}</span>
      </a>
    }
  </nav>

  <!-- Sidebar footer -->
  <div class="sidebar-footer">
    <div class="sidebar-footer-card">
      <div class="footer-card-row">
        <app-icon name="shield" [size]="15"/>
        <span>SST 8% compliant</span>
      </div>
      <div class="footer-card-row">
        <app-icon name="users" [size]="15"/>
        <span>Caregivers: 20</span>
      </div>
    </div>
    <p class="sidebar-copyright">CareKaki v1.0 &copy; {{ currentYear }}</p>
  </div>
</aside>

<!-- ===== Main content area ===== -->
<div class="main-wrapper">
  <!-- Top header bar -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-btn" (click)="toggleSidebar()" aria-label="Open menu">
        <app-icon name="menu" [size]="24"/>
      </button>
      <div class="topbar-brand">
        <span class="brand-name">CareKaki</span>
      </div>
    </div>

    <div class="topbar-right">
      <div class="search-box hide-mobile">
        <app-icon name="search" [size]="18"/>
        <input type="text" placeholder="Search caregivers, intakes, documents..." class="search-input"/>
      </div>

      <div class="user-chip">
        <div class="user-avatar">AK</div>
        <div class="user-info hide-mobile">
          <span class="user-name">Admin Kaki</span>
          <span class="user-role">Agency Manager</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Router outlet -->
  <main class="content">
    <router-outlet/>
  </main>

  <!-- Mobile bottom navigation -->
  <nav class="bottom-nav">
    @for (link of mobileNav; track link.route) {
      <a
        [routerLink]="link.route"
        routerLinkActive="active"
        class="bottom-nav-item"
      >
        <app-icon [name]="link.icon" [size]="22"/>
        <span class="bottom-nav-label">{{ link.label }}</span>
      </a>
    }
  </nav>
</div>
