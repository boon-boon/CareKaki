# Netlify deployment for CareKaki.
#
# CareKaki normally ships as one Node process serving the MCP API (/mcp),
# the health probe (/health) and the Angular SPA on a single port. Netlify
# serves static files from its CDN and cannot run a long-lived Node process,
# so the same stateless MCP server is re-hosted as two serverless functions
# (netlify/functions/mcp.mjs and health.mjs) while the pre-built SPA is
# published straight from the committed ./public bundle.
#
#   Browser ──▶ Netlify CDN ──┬─▶ /mcp     → functions/mcp    (MCP Streamable HTTP)
#                             ├─▶ /health  → functions/health (JSON probe)
#                             └─▶ /*       → /index.html      (Angular SPA)

[build]
  base = "/"
  # Compile the MCP server to dist/ and embed the provider CSV for the
  # serverless bundle. The Angular SPA is committed under ./public, so it does
  # not need to be rebuilt here.
  command = "npm install --include=dev --ignore-scripts && npm run build:netlify"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # The root "postinstall" installs the Angular toolchain, which this build does
  # not need. Skipping lifecycle scripts keeps the Netlify install fast and
  # removes a needless failure mode; the build command re-installs with
  # --include=dev so TypeScript is available for `npm run build`.
  NPM_FLAGS = "--ignore-scripts"

# The MCP Streamable HTTP endpoint. `force` guarantees the function is reached
# even though a catch-all SPA rewrite is declared below (first match wins).
[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

# Angular router deep links (/matching, /quotations/..., ...) fall back to the
# SPA shell. Real static assets are still served from the CDN before this rule
# applies, because it is not forced.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
